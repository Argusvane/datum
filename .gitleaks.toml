title = "datum secret scan"

# The default rule set applies; the allowlists below add to it.
[extend]
useDefault = true

# Deliberately committed throwaway keys, by directory (the file beside each set documents it).
# Only the private-key rule is silenced there, so a token committed beside them is still found.
[[allowlists]]
description = "Throwaway keys and certificates used as test material"
targetRules = ["private-key"]
paths = [
  # openssl fixtures for the PDF signing tests (README beside them documents them)
  '''packages/pdf-kernel/tests/fixtures/signing/''',
  # openssl fixtures for the JVM timestamp tests (generated by make-fixtures.sh beside them)
  '''integrations/jvm/libs/datum-timestamp-test-support/src/main/resources/fixtures/''',
]

# PEM text assembled from a freshly generated test key at run time.
[[allowlists]]
description = "Test keys generated at run time"
targetRules = ["private-key"]
paths = [
  '''integrations/jvm/spring/datum-pdf-spring/src/test/java/com/argusvane/datum/pdf/spring/SigningBundleTest\.java''',
  '''integrations/jvm/spring/datum-timestamp-spring/src/test/java/com/argusvane/datum/timestamp/spring/TsaSigningBundleTest\.java''',
]

# Test and fixture files that trip the generic rule without holding a credential: fixed
# passwords for the throwaway keystores, recorded WebAuthn assertions, forged tokens, UUID
# submission keys and code whose names (`key`, `RS256`) read like an assignment.
[[allowlists]]
description = "Test passwords, recorded assertions and identifiers in named test files"
targetRules = ["generic-api-key"]
paths = [
  # fixed passwords for the throwaway PKCS#12 keystores
  '''integrations/fastapi/packages/argusvane-datum-core/tests/tsa_support\.py''',
  '''integrations/fastapi/packages/argusvane-datum-fastapi/tests/wire/test_wire_tsa\.py''',
  # openssl commands that name the fixture key files
  '''packages/pdf-kernel/scripts/make-signing-fixtures\.mjs''',
  # recorded WebAuthn authenticator data and a forged token
  '''integrations/shared/fixtures/webauthn-engine\.json''',
  '''integrations/jvm/spring/datum-webauthn-spring/src/test/java/com/argusvane/datum/webauthn/web/PasskeysContract\.java''',
  # per-submit UUIDs used as submission keys
  '''packages/submissions/tests/service-submission-key\.test\.ts''',
  # identifiers: a `key` record component, and a COSE algorithm constant
  '''integrations/jvm/libs/datum-timestamp/src/test/java/com/argusvane/datum/timestamp/TestCertificates\.java''',
  '''integrations/jvm/libs/datum-webauthn/src/test/java/com/argusvane/datum/webauthn/WebAuthnVerifierTest\.java''',
]

# Production code whose parameter text reads like an assignment. Only that text is allowed, so
# the rest of each file is still scanned with every rule.
[[allowlists]]
description = "Parameter text in production code"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''PrivateKey key,''', '''key\.curve,''']
paths = [
  '''integrations/fastapi/packages/argusvane-datum-core/src/datum_core/timestamp/certificate\.py''',
  '''integrations/jvm/libs/datum-timestamp/src/main/java/com/argusvane/datum/timestamp/KeyChecks\.java''',
  '''integrations/jvm/libs/datum-timestamp/src/main/java/com/argusvane/datum/timestamp/TimestampAuthority\.java''',
]
