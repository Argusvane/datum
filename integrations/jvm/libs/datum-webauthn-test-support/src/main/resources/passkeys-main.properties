# A configured, signing site for the web tests: the forms petition and private sign (required); visitors may make passkeys.
datum.webauthn.enabled=true
datum.webauthn.rp-id=localhost
datum.webauthn.rp-name=Petition
datum.webauthn.origins=http://localhost
datum.webauthn.secret=a configured secret of at least 32 bytes!
datum.webauthn.anonymous=true
datum.webauthn.forms.petition.mode=required
datum.webauthn.forms.petition.statement=I confirm these answers.
datum.webauthn.forms.private.mode=required
# Who may make a passkey in a form's Test context: the web tests' "tester" and "admin" hold ROLE_TESTER.
datum.webauthn.test-roles=TESTER
