[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "argusvane-datum-sandbox-wasmtime"
version = "0.1.0"
description = "The wasmtime engine of argusvane-datum-sandbox: the pinned QuickJS guest under the WASI harness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
maintainers = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
keywords = ["datum", "wasmtime", "wasm", "sandbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "argusvane-datum-sandbox==0.1.0",
  "argusvane-datum-qjs-wasm==0.1.0",
  "wasmtime>=50,<51; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'arm64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64' or platform_machine == 'ARM64'))",
]

[project.entry-points."datum.guest_runtimes"]
wasmtime = "datum_sandbox_wasmtime:WasmtimeProvider"

[project.urls]
Homepage = "https://datum.argusvane.com"
Documentation = "https://datum.argusvane.com/docs/"
Repository = "https://github.com/argusvane/datum"
Issues = "https://github.com/argusvane/datum/issues"

[tool.hatch.build]
# Generated by the asset script, gitignored, carried through sdist and wheel; hatch_build.py only guards.
artifacts = ["src/datum_sandbox_wasmtime/datum-build.json", "src/datum_sandbox_wasmtime/manifest.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/datum_sandbox_wasmtime"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.datum-build]
# Where hatch_build.py looks for manifest.json (resource distributions only; first hit wins).
# no manifest: this distribution carries datum-build.json only

[tool.uv.sources]
argusvane-datum-sandbox = { workspace = true }
argusvane-datum-qjs-wasm = { workspace = true }

[tool.deptry]
# Run from the member directory: `deptry .`. DEP002 is ignored for the declared dependencies until the code that uses them lands.
extend_exclude = ["hatch_build.py"]
known_first_party = ["datum_sandbox_wasmtime"]

[tool.deptry.per_rule_ignores]
DEP002 = []

[tool.deptry.package_module_name_map]
pydantic-settings = "pydantic_settings"
opentelemetry-api = "opentelemetry"
pyhanko-certvalidator = "pyhanko_certvalidator"
cbor2 = "cbor2"
argusvane-datum-sandbox = "datum_sandbox"
argusvane-datum-qjs-wasm = "datum_qjs_wasm"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "runtime: needs the wasm runtime",
  "containers: needs Docker",
  "browser: Playwright, own process",
]
testpaths = ["tests"]
# timeout: no value decided yet

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["datum_sandbox_wasmtime"]

[tool.coverage.report]
fail_under = 0  # placeholder: the floor is set when the member has code
