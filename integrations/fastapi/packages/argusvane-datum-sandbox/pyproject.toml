[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "argusvane-datum-sandbox"
version = "0.1.0"
description = "Datum's programs run in a hardened WebAssembly sandbox: the WASI run, the run protocol, the lifecycle and diagnostics."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
maintainers = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
keywords = ["datum", "wasm", "sandbox", "quickjs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "argusvane-datum-programs==0.1.0",
]

[project.optional-dependencies]
aio = ["anyio>=4"]
testing = ["pytest"]

[project.urls]
Homepage = "https://datum.argusvane.com"
Documentation = "https://datum.argusvane.com/docs/"
Repository = "https://github.com/argusvane/datum"
Issues = "https://github.com/argusvane/datum/issues"

[tool.hatch.build]
# Generated by the asset script, gitignored, carried through sdist and wheel; hatch_build.py only guards.
artifacts = ["src/datum_sandbox/datum-build.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/datum_sandbox"]

[tool.hatch.build.targets.sdist]
# The tests stay in the repository: the kit the engines run is datum_sandbox.testing, inside the package.
exclude = ["tests"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.datum-build]
# Where hatch_build.py looks for manifest.json (resource distributions only; first hit wins).
# no manifest: this distribution carries datum-build.json only

[tool.uv.sources]
argusvane-datum-programs = { workspace = true }

[tool.deptry]
# Run from the member directory: `deptry .`.
extend_exclude = ["hatch_build.py"]
known_first_party = ["datum_sandbox"]

[tool.deptry.per_rule_ignores]
# argusvane-datum-programs is read as resources (importlib.resources by name), never imported.
DEP002 = ["argusvane-datum-programs"]

[tool.deptry.package_module_name_map]
argusvane-datum-programs = "datum_programs"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "runtime: needs the wasm runtime",
  "containers: needs Docker",
  "browser: Playwright, own process",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["datum_sandbox"]

[tool.coverage.report]
fail_under = 0  # placeholder: the floor is set when the member has code
