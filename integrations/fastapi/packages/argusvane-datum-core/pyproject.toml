[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "argusvane-datum-core"
version = "0.1.0"
description = "The framework-free decisions of Datum: services, hooks, events, stores, configuration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
maintainers = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
keywords = ["datum", "forms", "validation", "pdf", "rfc3161"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "argusvane-datum-sandbox==0.1.0",
  "pydantic>=2.11,<3",
  "opentelemetry-api>=1.30,<2",
  "tzdata",
  "tzlocal>=5",
]

[project.optional-dependencies]
aio = ["anyio"]
limits = ["limits>=5,<6"]
pdf = ["cryptography>=45,<51", "argusvane-datum-core[timestamp]"]
timestamp = ["asn1crypto>=1.5,<2", "cryptography>=44,<51"]
testing = ["pytest", "hypothesis>=6", "argusvane-datum-programs==0.1.0", "argusvane-datum-sandbox[testing]==0.1.0", "opentelemetry-sdk>=1.30,<2"]
revocation = ["argusvane-datum-core[pdf]", "pyhanko-certvalidator>=0.33,<0.34"]

[project.urls]
Homepage = "https://datum.argusvane.com"
Documentation = "https://datum.argusvane.com/docs/"
Repository = "https://github.com/argusvane/datum"
Issues = "https://github.com/argusvane/datum/issues"

[tool.hatch.build]
# Generated by the asset script, gitignored, carried through sdist and wheel; hatch_build.py only guards.
artifacts = ["src/datum_core/datum-build.json", "src/datum_core/manifest.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/datum_core"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.datum-build]
# Where hatch_build.py looks for manifest.json (resource distributions only; first hit wins).
# no manifest: this distribution carries datum-build.json only

[tool.uv.sources]
argusvane-datum-programs = { workspace = true }
argusvane-datum-sandbox = { workspace = true }

[tool.deptry]
# Run from the member directory: `deptry .`. DEP002 is ignored for the declared dependencies until the code that uses them lands.
extend_exclude = ["hatch_build.py"]
known_first_party = ["datum_core"]

[tool.deptry.per_rule_ignores]
DEP002 = ["anyio", "asn1crypto", "cryptography", "argusvane-datum-core", "argusvane-datum-programs", "limits", "opentelemetry-api", "opentelemetry-sdk", "pydantic", "pyhanko-certvalidator", "pytest", "tzdata"]

[tool.deptry.package_module_name_map]
# pydantic_core is pydantic's own core (version-locked by pydantic); its core_schema and PydanticCustomError are the documented custom-type API.
pydantic = ["pydantic", "pydantic_core"]
pydantic-settings = "pydantic_settings"
opentelemetry-api = "opentelemetry"
pyhanko-certvalidator = "pyhanko_certvalidator"
argusvane-datum-core = "datum_core"
argusvane-datum-sandbox = "datum_sandbox"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "runtime: needs the wasm runtime",
  "containers: needs Docker",
  "browser: Playwright, own process",
  "server: boots a server process (uvicorn, host-check); serial, never under xdist",
  "openssl: needs the openssl binary (the timestamp cross-check); skipped with a reason when absent",
]
testpaths = ["tests"]
# timeout: no value decided yet

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["datum_core"]

[tool.coverage.report]
fail_under = 0  # placeholder: the floor is set when the member has code
