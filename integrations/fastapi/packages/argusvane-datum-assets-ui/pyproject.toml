[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "argusvane-datum-assets-ui"
version = "0.1.0"
description = "The browser assets of the Datum form and builder elements."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
maintainers = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
keywords = ["datum", "forms", "form-builder", "web-components"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://datum.argusvane.com"
Documentation = "https://datum.argusvane.com/docs/"
Repository = "https://github.com/argusvane/datum"
Issues = "https://github.com/argusvane/datum/issues"

[tool.hatch.build]
# Generated by the asset script, gitignored, carried through sdist and wheel; hatch_build.py only guards.
artifacts = ["src/datum_assets_ui/datum-build.json", "src/datum_assets_ui/manifest.json", "src/datum_assets_ui/assets/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/datum_assets_ui"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.datum-build]
# Where hatch_build.py looks for manifest.json (resource distributions only; first hit wins).
manifest = ["resources/manifest.json", "assets/manifest.json", "manifest.json"]

[tool.deptry]
# Run from the member directory: `deptry .`. DEP002 is ignored for the declared dependencies until the code that uses them lands.
extend_exclude = ["hatch_build.py"]
known_first_party = ["datum_assets_ui"]

[tool.deptry.per_rule_ignores]
DEP002 = []

[tool.deptry.package_module_name_map]
pydantic-settings = "pydantic_settings"
opentelemetry-api = "opentelemetry"
pyhanko-certvalidator = "pyhanko_certvalidator"
cbor2 = "cbor2"
argusvane-datum-core = "datum_core"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "runtime: needs the wasm runtime",
  "containers: needs Docker",
  "browser: Playwright, own process",
]
testpaths = ["tests"]
# timeout: no value decided yet

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["datum_assets_ui"]

[tool.coverage.report]
fail_under = 0  # placeholder: the floor is set when the member has code
