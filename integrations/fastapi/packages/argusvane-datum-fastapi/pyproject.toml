[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "argusvane-datum-fastapi"
version = "0.1.0"
description = "Datum for FastAPI: routers, settings and OpenAPI over argusvane-datum-core."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
maintainers = [{ name = "Argusvane", email = "maintainers@argusvane.com" }]
keywords = ["datum", "forms", "fastapi", "asgi", "pdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Framework :: FastAPI",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "argusvane-datum-core[aio]==0.1.0",
  "argusvane-datum-sandbox==0.1.0",
  "fastapi>=0.133.0",
  "starlette>=1.0,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings",
]

[project.optional-dependencies]
submissions = ["argusvane-datum-programs==0.1.0", "argusvane-datum-sandbox-wasmtime==0.1.0", "argusvane-datum-core[limits]==0.1.0"]
ui = ["argusvane-datum-fastapi[submissions]", "argusvane-datum-assets-ui==0.1.0"]
pdf = ["argusvane-datum-fastapi[submissions]", "argusvane-datum-core[pdf]==0.1.0", "argusvane-datum-assets-pdf==0.1.0"]
revocation = ["argusvane-datum-core[revocation]==0.1.0"]
timestamp = ["argusvane-datum-core[timestamp]==0.1.0"]
testing = ["argusvane-datum-core[testing]==0.1.0", "httpx2"]
all = ["argusvane-datum-fastapi[ui,pdf,revocation,timestamp]"]

[project.urls]
Homepage = "https://datum.argusvane.com"
Documentation = "https://datum.argusvane.com/docs/"
Repository = "https://github.com/argusvane/datum"
Issues = "https://github.com/argusvane/datum/issues"

[tool.hatch.build]
# Generated by the asset script, gitignored, carried through sdist and wheel; hatch_build.py only guards.
artifacts = ["src/datum_fastapi/datum-build.json", "src/datum_fastapi/manifest.json", "src/datum_fastapi/web/resources/**", "src/datum_fastapi/datum-settings.schema.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/datum_fastapi"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.datum-build]
# Where hatch_build.py looks for manifest.json (resource distributions only; first hit wins).
# no manifest: this distribution carries datum-build.json only

[tool.uv.sources]
argusvane-datum-core = { workspace = true }
argusvane-datum-programs = { workspace = true }
argusvane-datum-sandbox = { workspace = true }
argusvane-datum-sandbox-wasmtime = { workspace = true }
argusvane-datum-assets-ui = { workspace = true }
argusvane-datum-assets-pdf = { workspace = true }

[tool.deptry]
# Run from the member directory: `deptry .`. DEP002 is ignored for the declared dependencies until the code that uses them lands.
extend_exclude = ["hatch_build.py"]
known_first_party = ["datum_fastapi"]

[tool.deptry.per_rule_ignores]
DEP002 = ["argusvane-datum-assets-pdf", "argusvane-datum-assets-ui", "argusvane-datum-core", "argusvane-datum-fastapi", "argusvane-datum-programs", "argusvane-datum-sandbox-wasmtime", "fastapi", "httpx2", "pydantic-settings"]

[tool.deptry.package_module_name_map]
pydantic-settings = "pydantic_settings"
opentelemetry-api = "opentelemetry"
pyhanko-certvalidator = "pyhanko_certvalidator"
cbor2 = "cbor2"
argusvane-datum-core = "datum_core"
argusvane-datum-sandbox = "datum_sandbox"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "runtime: needs the wasm runtime",
  "containers: needs Docker",
  "browser: Playwright, own process",
  "server: boots a server process (uvicorn, host-check); serial, never under xdist",
  "openssl: needs the openssl binary (the timestamp cross-check); skipped with a reason when absent",
]
testpaths = ["tests"]
# timeout: no value decided yet

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["datum_fastapi"]

[tool.coverage.report]
fail_under = 0  # placeholder: the floor is set when the member has code
