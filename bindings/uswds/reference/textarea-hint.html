<form novalidate class="usa-form usa-form--large">
<p>Required fields are marked with an asterisk (<abbr title="required" class="usa-hint usa-hint--required">*</abbr>).</p>
<div class="usa-form-group">
<label class="usa-label" for="field1">Tell us more <abbr title="required" class="usa-hint usa-hint--required">*</abbr></label>
<span class="usa-hint" id="field1-hint">Do not include personal information.</span>
<textarea class="usa-textarea" id="field1" name="field1" rows="5" aria-describedby="field1-hint" required></textarea>
</div>
</form>
