<form novalidate class="usa-form usa-form--large">
<p>Required fields are marked with an asterisk (<abbr title="required" class="usa-hint usa-hint--required">*</abbr>).</p>
<div class="usa-form-group">
<fieldset class="usa-fieldset" aria-describedby="field1-hint">
<legend class="usa-legend">Select one historical figure <abbr title="required" class="usa-hint usa-hint--required">*</abbr></legend>
<span class="usa-hint" id="field1-hint">Choose the person you would like to read about.</span>
<div class="usa-radio">
<input class="usa-radio__input" id="field1-sojourner-truth" type="radio" name="field1" value="sojourner-truth">
<label class="usa-radio__label" for="field1-sojourner-truth">Sojourner Truth</label>
</div>
<div class="usa-radio">
<input class="usa-radio__input" id="field1-frederick-douglass" type="radio" name="field1" value="frederick-douglass">
<label class="usa-radio__label" for="field1-frederick-douglass">Frederick Douglass</label>
</div>
<div class="usa-radio">
<input class="usa-radio__input" id="field1-booker-t-washington" type="radio" name="field1" value="booker-t-washington">
<label class="usa-radio__label" for="field1-booker-t-washington">Booker T. Washington</label>
</div>
</fieldset>
</div>
</form>
