<form novalidate class="usa-form usa-form--large">
<p>Required fields are marked with an asterisk (<abbr title="required" class="usa-hint usa-hint--required">*</abbr>).</p>
<div class="usa-character-count" data-maxlength="25">
<div class="usa-form-group">
<label class="usa-label" for="field1">Text input <abbr title="required" class="usa-hint usa-hint--required">*</abbr></label>
<span id="field1-hint" class="usa-hint">This is an input with a character counter.</span>
<input class="usa-input usa-character-count__field" id="field1" name="field1" aria-describedby="field1-info field1-hint" data-enhanced="true" data-character-count-over-limit="false" required value="">
</div>
<span id="field1-info" class="usa-character-count__message usa-sr-only">You can enter up to 25 characters</span>
<div class="usa-character-count__status usa-hint" aria-hidden="true">25 characters allowed</div>
<div class="usa-character-count__sr-status usa-sr-only" aria-live="polite">25 characters allowed</div>
</div>
</form>
