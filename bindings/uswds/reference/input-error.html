<form novalidate class="usa-form usa-form--large">
<div class="usa-alert usa-alert--error" role="alert" tabindex="-1">
<div class="usa-alert__body">
<h2 class="usa-alert__heading">1 error</h2>
<ul class="usa-list">
<li><a class="usa-link" href="#field1">City: Enter your city.</a></li>
</ul>
</div>
</div>
<p>Required fields are marked with an asterisk (<abbr title="required" class="usa-hint usa-hint--required">*</abbr>).</p>
<div class="usa-form-group usa-form-group--error">
<label class="usa-label usa-label--error" for="field1">City <abbr title="required" class="usa-hint usa-hint--required">*</abbr></label>
<span class="usa-error-message" id="field1-error" role="alert">Enter your city.</span>
<input class="usa-input usa-input--error" id="field1" name="field1" type="text" aria-describedby="field1-error" aria-invalid="true" required>
</div>
</form>
