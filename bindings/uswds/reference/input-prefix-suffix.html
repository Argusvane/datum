<form novalidate class="usa-form usa-form--large">
<p>Required fields are marked with an asterisk (<abbr title="required" class="usa-hint usa-hint--required">*</abbr>).</p>
<div class="usa-form-group">
<label class="usa-label" for="field1">Amount <abbr title="required" class="usa-hint usa-hint--required">*</abbr></label>
<div class="usa-input-group">
<div class="usa-input-prefix" aria-hidden="true">$</div>
<input class="usa-input" id="field1" name="field1" type="text" required>
<div class="usa-input-suffix" aria-hidden="true">USD</div>
</div>
</div>
</form>
