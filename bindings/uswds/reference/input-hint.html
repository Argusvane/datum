<form novalidate class="usa-form usa-form--large">
<p>Required fields are marked with an asterisk (<abbr title="required" class="usa-hint usa-hint--required">*</abbr>).</p>
<div class="usa-form-group">
<label class="usa-label" for="field1">Full name <abbr title="required" class="usa-hint usa-hint--required">*</abbr></label>
<span class="usa-hint" id="field1-hint">Use the name on your birth certificate.</span>
<input class="usa-input" id="field1" name="field1" type="text" aria-describedby="field1-hint" required>
</div>
</form>
