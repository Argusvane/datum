<form novalidate class="usa-form usa-form--large">
<p>Required fields are marked with an asterisk (<abbr title="required" class="usa-hint usa-hint--required">*</abbr>).</p>
<div class="usa-form-group">
<fieldset class="usa-fieldset">
<legend class="usa-legend">Date of Birth <abbr title="required" class="usa-hint usa-hint--required">*</abbr></legend>
<span class="usa-hint" aria-hidden="true" id="field1-hint">Select a month. Enter 1 or 2 digits for the day and 4 digits for the year.</span>
<div class="usa-memorable-date">
<div class="usa-form-group usa-form-group--month usa-form-group--select">
<label class="usa-label" for="field1-month">Month</label>
<span class="usa-hint usa-sr-only" id="field1-month-hint">Select a month from the dropdown.</span>
<select class="usa-select" id="field1-month" name="field1-month" aria-describedby="field1-month-hint">
<option value>- Select -</option>
<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6">June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>
</select>
</div>
<div class="usa-form-group usa-form-group--day">
<label class="usa-label" for="field1-day">Day</label>
<span class="usa-hint usa-sr-only" id="field1-day-hint">Enter 1 or 2 digits for the day.</span>
<input class="usa-input" aria-describedby="field1-day-hint" id="field1-day" name="field1-day" maxlength="2" pattern="[0-9]*" inputmode="numeric" value="">
</div>
<div class="usa-form-group usa-form-group--year">
<label class="usa-label" for="field1-year">Year</label>
<span class="usa-hint usa-sr-only" id="field1-year-hint">Enter 4 digits for the year.</span>
<input class="usa-input" aria-describedby="field1-year-hint" id="field1-year" name="field1-year" minlength="4" maxlength="4" pattern="[0-9]*" inputmode="numeric" value="">
</div>
</div>
</fieldset>
</div>
</form>
