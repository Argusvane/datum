<form novalidate>
<fieldset class="mb-3" aria-describedby="field1-hint">
<legend class="col-form-label pt-0">Contact method</legend>
<div id="field1-hint" class="form-text">How should we reach you?</div>
<div class="form-check">
<input class="form-check-input" id="field1-email" name="field1" type="radio" value="email">
<label class="form-check-label" for="field1-email">Email</label>
</div>
<div class="form-check">
<input class="form-check-input" id="field1-phone" name="field1" type="radio" value="phone">
<label class="form-check-label" for="field1-phone">Phone</label>
</div>
<div class="form-check">
<input class="form-check-input" id="field1-post" name="field1" type="radio" value="post">
<label class="form-check-label" for="field1-post">Post</label>
</div>
</fieldset>
</form>
