<form novalidate>
<fieldset class="mb-3" aria-describedby="field1-hint">
<legend class="col-form-label pt-0">Extras</legend>
<div id="field1-hint" class="form-text">Choose any that apply.</div>
<div class="form-check">
<input class="form-check-input" id="field1-a" name="field1" type="checkbox" value="a">
<label class="form-check-label" for="field1-a">Gift wrap</label>
</div>
<div class="form-check">
<input class="form-check-input" id="field1-b" name="field1" type="checkbox" value="b">
<label class="form-check-label" for="field1-b">Express</label>
</div>
</fieldset>
</form>
