<form novalidate>
<div class="alert alert-danger" role="alert" tabindex="-1">
<h2 class="alert-heading h5">1 error</h2>
<ul class="mb-0">
<li><a class="alert-link" href="#field1">City: Enter your city.</a></li>
</ul>
</div>
<div class="mb-3">
<label class="form-label" for="field1">City <span class="text-danger" aria-hidden="true">*</span></label>
<input class="form-control is-invalid" id="field1" name="field1" type="text" aria-describedby="field1-error" aria-invalid="true" required>
<div id="field1-error" class="invalid-feedback">Enter your city.</div>
</div>
</form>
