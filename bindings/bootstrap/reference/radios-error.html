<form novalidate>
<div class="alert alert-danger" role="alert" tabindex="-1">
<h2 class="alert-heading h5">1 error</h2>
<ul class="mb-0">
<li><a class="alert-link" href="#field1-email">Contact method: Choose a contact method.</a></li>
</ul>
</div>
<fieldset class="mb-3" aria-describedby="field1-error">
<legend class="col-form-label pt-0">Contact method <span class="text-danger" aria-hidden="true">*</span></legend>
<div class="form-check">
<input class="form-check-input is-invalid" id="field1-email" name="field1" type="radio" value="email" required>
<label class="form-check-label" for="field1-email">Email</label>
</div>
<div class="form-check">
<input class="form-check-input is-invalid" id="field1-phone" name="field1" type="radio" value="phone" required>
<label class="form-check-label" for="field1-phone">Phone</label>
<div id="field1-error" class="invalid-feedback">Choose a contact method.</div>
</div>
</fieldset>
</form>
