<form novalidate>
<div class="govuk-error-summary" data-module="govuk-error-summary">
<div role="alert">
<h2 class="govuk-error-summary__title"> There is a problem </h2>
<div class="govuk-error-summary__body">
<ul class="govuk-list govuk-error-summary__list">
<li>
<a href="#field1">Enter details of your request</a>
</li>
</ul>
</div>
</div>
</div>
<div class="govuk-form-group govuk-form-group--error">
<label class="govuk-label" for="field1"> Can you provide more detail? </label>
<div id="field1-hint" class="govuk-hint"> Do not include personal or financial information. </div>
<p id="field1-error" class="govuk-error-message">
<span class="govuk-visually-hidden">Error:</span> Enter details of your request </p> <textarea class="govuk-textarea govuk-textarea--error" id="field1" name="field1" rows="5" aria-describedby="field1-hint field1-error"></textarea> </div>
</form>
